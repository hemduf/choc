name: Apply webview-gui plugin-safe CHOC patch

on:
  push:
    branches:
      - webview-gui-plugin-safe

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[choc-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webview-gui-plugin-safe
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_webview_gui_plugin_safe_patch.py

      - name: Commit patched CHOC header
        shell: bash
        run: |
          if git diff --quiet -- choc/gui/choc_WebView.h; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add choc/gui/choc_WebView.h
          git commit -m "Patch WebView for unloadable plugin hosts [choc-patch-applied]"
          git push origin HEAD:webview-gui-plugin-safe
